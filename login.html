<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - NurseryNextDoor</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    * { box-sizing:border-box; }
    body {
      margin:0;
      font-family:'Montserrat',sans-serif;
      background: #f0f9f4;
      color: #2f3e46;
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:100vh;
      padding:20px;
    }
    .card {
      background:#fff;
      border-radius:12px;
      box-shadow:0 25px 80px -10px rgba(46,139,87,0.15);
      max-width: 420px;
      width:100%;
      padding:32px 28px;
    }
    h2 {
      margin-top:0;
      font-size:1.9rem;
      color:#2e8b57;
    }
    .field {
      margin-bottom:16px;
    }
    label {
      display:block;
      font-size:0.65rem;
      font-weight:600;
      text-transform:uppercase;
      letter-spacing:1px;
      margin-bottom:6px;
    }
    input {
      width:100%;
      padding:12px 14px;
      border:1px solid #d9e5de;
      border-radius:8px;
      font-size:1rem;
      outline:none;
      font-family:inherit;
    }
    .password-wrapper {
      position:relative;
    }
    .toggle {
      position:absolute;
      right:10px;
      top:50%;
      transform:translateY(-50%);
      background:none;
      border:none;
      cursor:pointer;
      font-size:0.9rem;
      color:#555;
    }
    .btn {
      background:#2e8b57;
      color:#fff;
      border:none;
      padding:14px;
      width:100%;
      border-radius:8px;
      cursor:pointer;
      font-weight:600;
      font-size:1rem;
      transition:filter .2s;
    }
    .btn:hover { filter:brightness(1.05); }
    .small {
      font-size:0.85rem;
      margin-top:12px;
      text-align:center;
    }
    .link {
      color:#2e8b57;
      text-decoration:underline;
      cursor:pointer;
      background:none;
      border:none;
      padding:0;
      font-size:0.85rem;
    }
    .feedback {
      font-size:0.9rem;
      padding:10px 14px;
      border-radius:6px;
      margin-bottom:12px;
      display:none;
    }
    .error { background:#ffe3e3; color:#7a2f2f; display:block; }
    .success { background:#d4edda; color:#235a37; display:block; }
  </style>
</head>
<body>

  <div class="card" aria-label="Login">
    <h2>Login to NurseryNextDoor</h2>
    <div id="feedback" class="feedback"></div>
    <form id="login-form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="you@example.com" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div class="password-wrapper">
          <input id="password" type="password" placeholder="••••••••" required>
          <button type="button" class="toggle" data-target="password">Show</button>
        </div>
      </div>
      <button type="submit" class="btn">Login</button>
    </form>
    <div class="small">
      Don't have an account? <a href="signup.html" class="link">Sign Up</a>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'nn_simple_user'; // must match signup storage

    function getUser() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch { return null; }
    }

    // toggle password visibility
    document.querySelectorAll('.toggle').forEach(btn => {
      btn.addEventListener('click', () => {
        const target = document.getElementById(btn.dataset.target);
        if (target.type === 'password') {
          target.type = 'text';
          btn.textContent = 'Hide';
        } else {
          target.type = 'password';
          btn.textContent = 'Show';
        }
      });
    });

    function showMessage(msg, isSuccess = false) {
      const fb = document.getElementById('feedback');
      fb.textContent = msg;
      fb.className = 'feedback ' + (isSuccess ? 'success' : 'error');
      setTimeout(() => { fb.style.display = 'none'; }, 4000);
    }

    document.getElementById('login-form').addEventListener('submit', e => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim().toLowerCase();
      const pwd = document.getElementById('password').value;
      if (!email || !pwd) {
        showMessage('Email and password required.', false);
        return;
      }
      const user = getUser();
      if (!user) {
        showMessage('No account found. Please sign up first.', false);
        return;
      }
      if (user.email !== email || user.password !== pwd) {
        showMessage('Invalid credentials.', false);
        return;
      }
      showMessage(`Welcome back, ${user.name}!`, true);
      // mock login; persist session
      sessionStorage.setItem('nn_logged_in', JSON.stringify({ email: user.email, name: user.name }));
      // redirect to homepage after short delay
      setTimeout(() => {
        window.location.href = 'main.html';
      }, 800);
    });
  </script>

</body>
</html>
